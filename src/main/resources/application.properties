spring.application.name=jobtracker
spring.h2.console.enabled=true

# verkkoselaimessa käytettävä tietkannan GUI
# spring.h2.console.path=/h2-console
# spring.datasource.url=jdbc:h2:mem:testdb
spring.jpa.show-sql=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/minhd?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=minhd
# The password is not saved in the code. It is given when the app starts.
spring.datasource.password=${MYSQL_PASSWORD}
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
# pilvessä käytetty portti
server.port=8091
spring.data.rest.base-path=/api

# errorpage
# spring.web.error.whitelabel.enabled =false

server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat
server.ssl.key-store=${SERVER_SSL_KEY_STORE:file:./springboot-example.p12}
server.ssl.key-store-password=changeit