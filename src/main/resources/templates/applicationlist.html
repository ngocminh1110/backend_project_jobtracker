<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Job Tracker</title>
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>

    <div class="container mt-4">

        <h2 class="mb-4">My Job Applications</h2>

        <div class="d-flex justify-content-between mb-3">
            <a th:href="@{/addapplication}" class="btn btn-success">Add Application</a>

            <form th:action="@{/logout}" method="post" class="m-0">
                <input type="submit" value="Sign Out" class="btn btn-secondary">
            </form>
        </div>

        <table class="table table-striped align-middle">

            <thead>
                <tr>
                    <th>Company</th>
                    <th>Position</th>
                    <th>Location</th>
                    <th>Applied Date</th>
                    <th>Status</th>
                    <th>Job Link</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="job : ${applications}">

                    <td th:text="${job.company}"></td>
                    <td th:text="${job.position}"></td>
                    <td th:text="${job.location}"></td>

                    <td th:text="${job.appliedDate != null ? #temporals.format(job.appliedDate, 'dd.MM.yyyy') : '-'}">
                    </td>

                    <td th:text="${job.status}"></td>

                    <td>
                        <a th:if="${!#strings.isEmpty(job.jobUrl)}" th:href="${job.jobUrl}" target="_blank">Open</a>
                    </td>

                    <td class="text-nowrap">
                        <a th:href="@{/edit/{id}(id=${job.id})}" class="btn btn-sm btn-primary">Edit</a>
                        <a th:href="@{/delete/{id}(id=${job.id})}" class="btn btn-sm btn-danger">Delete</a>
                    </td>

                </tr>
            </tbody>

        </table>

    </div>

</body>

</html>
